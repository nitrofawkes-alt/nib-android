name: Build Nib APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Patch Nib native companion
        run: |
          PLUGIN=node_modules/nib-floating-window-cap/android
          cp native-patch/build.gradle "$PLUGIN/build.gradle"
          cp native-patch/AndroidManifest.xml "$PLUGIN/src/main/AndroidManifest.xml"
          cp native-patch/NibOverlayService.java "$PLUGIN/src/main/java/app/byshawn/nib/overlay/NibOverlayService.java"
          cp native-patch/NibFloatingWindowPlugin.java "$PLUGIN/src/main/java/app/byshawn/nib/overlay/NibFloatingWindowPlugin.java"
          cp native-patch/NibWakeService.java "$PLUGIN/src/main/java/app/byshawn/nib/overlay/NibWakeService.java"
          cp native-patch/NibPanelActivity.java "$PLUGIN/src/main/java/app/byshawn/nib/overlay/NibPanelActivity.java"
          mkdir -p "$PLUGIN/src/main/res/values"
          cp native-patch/styles.xml "$PLUGIN/src/main/res/values/styles.xml"

      - name: Create Android project
        run: npx cap add android

      - name: Sync native plugins
        run: npx cap sync android

      - name: Restore permanent signing key
        env:
          NIB_KEYSTORE_BASE64: ${{ secrets.NIB_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$NIB_KEYSTORE_BASE64" | base64 --decode > android/app/nib-release.p12
          test -s android/app/nib-release.p12

      - name: Configure permanent signing
        run: |
          cat >> android/app/build.gradle <<'GRADLE'
          android {
              signingConfigs {
                  nibPermanent {
                      storeFile file('nib-release.p12')
                      storePassword System.getenv('NIB_KEYSTORE_PASSWORD')
                      keyAlias 'nib'
                      keyPassword System.getenv('NIB_KEYSTORE_PASSWORD')
                      storeType 'pkcs12'
                  }
              }
              defaultConfig {
                  versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.nibPermanent
                  }
              }
          }
          GRADLE

      - name: Build signed debug APK
        working-directory: android
        env:
          NIB_KEYSTORE_PASSWORD: ${{ secrets.NIB_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nib-signed-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
